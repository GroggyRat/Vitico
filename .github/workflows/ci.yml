name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitico
          POSTGRES_PASSWORD: vitico
          POSTGRES_DB: vitico_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitico"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vitico:vitico@localhost:5432/vitico_test
      TEST_DATABASE_URL: postgresql://vitico:vitico@localhost:5432/vitico_test
      APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations and check they match the schema
        run: |
          pnpm --filter @vitico/db exec prisma migrate deploy
          pnpm --filter @vitico/db exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @vitico/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter @vitico/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7
