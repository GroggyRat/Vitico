services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vitico
      POSTGRES_PASSWORD: vitico
      POSTGRES_DB: vitico
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Optional local Odoo for integration development:
  #   docker compose --profile odoo up -d
  # then open http://localhost:8069, create database "vitico-dev", install Sales + Invoicing,
  # create an API key for an integration user and set the ODOO_* variables in .env.
  odoo-db:
    profiles: [odoo]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-pgdata:/var/lib/postgresql/data
  odoo:
    profiles: [odoo]
    image: odoo:19
    depends_on: [odoo-db]
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo

volumes:
  pgdata:
  odoo-pgdata:
  odoo-data:
